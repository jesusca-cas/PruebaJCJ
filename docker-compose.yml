services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prueba_jcj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prueba_jcj"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm install && node src/index.js"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/prueba_jcj
      JWT_SECRET: demo-secret-change-me
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      API_PROXY: http://api:3001
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
